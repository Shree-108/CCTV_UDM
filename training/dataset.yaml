# Uniform classifier dataset + training configuration (used by training/*.py)
#
# Put UPPER-BODY crops (use `prepare_dataset.py extract` to make them from CCTV)
# into the labelled folders below, then run `python training/train.py`.
sources:
  uniform: data/uniform           # the striped store shirt: front/side/back, near/far, lit/dim, partial
  non_uniform: data/non_uniform   # plain black/white, horizontal stripes, checks, prints, jackets,
                                  # T-shirts, similar striped shirts, customers in black/white
  uncertain: data/uncertain       # torso mostly hidden, heavy blur, too tiny to judge

output_dir: data/cls              # built split: data/cls/{train,val}/{class}/
val_split: 0.2
seed: 42
# Crops named "<clip>__t<track>__f<frame>.jpg" are grouped by clip+track so the
# same person never appears in both train and val (prevents inflated scores).

lowres_augment:                   # extra degraded copies (train split only)
  enabled: true
  copies_per_image: 1

train:
  base_model: yolo11n-cls.pt
  epochs: 60
  imgsz: 224
  batch: 32
  patience: 15                    # early stopping on the validation split; best.pt = best validation epoch
  optimizer: AdamW                # fine-tuning a pretrained classifier: small, stable steps
  lr0: 0.0005
  seed: 42                        # with deterministic: true, a re-run on the same data gives the same model
  deterministic: true
  # NO rotation / vertical flip: rotating 90 degrees turns vertical stripes into
  # horizontal ones, which are an explicit NEGATIVE class.
  degrees: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.0
  hsv_s: 0.3
  hsv_v: 0.4
  erasing: 0.3                    # simulates partial occlusion
  scale: 0.3

# Crop shape: every crop is resized to model.crop_size of config/uniform_config.yaml by prepare_dataset.py,
# exactly as production inference does (do not change one without the other).
# Output: a NEW candidate under models/candidates/ (training/candidate.py) - the active model is never
# overwritten. Activate only after review: python -m training.register_model --activate <folder>

evaluation:
  target_uniform_precision: 0.98  # false positives make compliance unreliable
  # INDEPENDENT TEST SET - never used for training, checkpoint selection or threshold tuning (the
  # threshold is chosen on the validation split). Put crops from OTHER days / stores / cameras / people
  # than the training data here: data/validation/<subset>/<true_class>/*.jpg (e.g. subset = cctv_day3).
  # It is empty on this PC: until it is filled no accuracy figure can be reported.
  subsets_dir: data/validation
