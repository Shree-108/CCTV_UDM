# Uniform model + inference configuration — the single source of truth.
#
# All paths are RELATIVE TO THE PROJECT ROOT, so the same file works on every PC.
# Never put an absolute path (C:/Users/..., Desktop, Downloads, runs/...) here.
#
# Overrides (optional, e.g. in .env):
#   SU_UNIFORM_CONFIG=path/to/other_config.yaml
#   SU_UNIFORM_MODEL=models/some_other.pt
#   SU_DEVICE=cpu | cuda | auto
#
# Values under `inference:` are the DEFAULTS of the Settings page. A change made in
# Settings is stored per installation in storage/settings.json; "Reset to defaults"
# returns to the values below.

model:
  name: yatrikart-uniform-cls
  version: "0.2.0"                 # bump whenever models/uniform_best.pt is replaced
  status: "experimental"                       # e.g. experimental | production
  dataset_version: "bootstrap-018c9cdd: 4 uniform people (3 photos + 1 CCTV staff, 138 frames), 3 real non-uniform groups (incl. 1 CCTV customer, 78 frames), 9 synthetic patterns"              # what the weights were trained on (written by training scripts / by hand)
  path: models/uniform_best.pt     # the trained uniform classifier (restore it here)
  # Older location written by previous versions of training/train.py. Used only if
  # `path` is missing, with a warning in the log — move the file to `path`.
  legacy_paths:
    - models/uniform/best.pt
  # SHA-256 of the approved weights. Fill it with:  python -m training.register_model
  # When set, every deployment verifies it has the exact same model file.
  sha256: "5d785e8bd947bca545dd2c9a4397bdcf876449e831f5195173f2d3f1f1cc54af"
  task: classify                   # Ultralytics YOLO-cls (training/train.py)
  # yolo_cls    : Ultralytics YOLO-cls weights (the production v0.2.0 model)
  # torchvision : EfficientNet-B0 / MobileNetV3 checkpoint (training/train_torchvision.py, training/udm_train.py)
  backend: yolo_cls
  # Which part of the person the classifier sees:
  # torso_band : 12-55 % of the person box height (v0.2.0 was trained on this; the production default)
  # garment    : the shirt located from body keypoints (backend/uniform/garment.py, models/person/yolo11n-pose.pt),
  #              letterboxed to 224 x 224 - the v0.3.0 candidates are trained on this. Set by
  #              `python -m training.register_model --activate <candidate>`; never by hand without its model.
  crop_mode: torso_band
  imgsz: 224                       # classifier input size used in training
  # [width, height] every torso crop is resized to before the classifier sees it. MUST match how the
  # weights were trained: training/bootstrap.py (v0.1.0, v0.2.0) resized every crop to 112x160 (its
  # SIZE reads this value). Before 2026-10-29 inference skipped this step, so the network saw crops
  # proportioned differently than in training - the cause of the light-blue patterned shirt scoring
  # P(uniform) 0.94 (0.03 at the training shape). null = pass crops as-is (training/train.py models).
  # Rollback to the old behaviour: set null and restart the API.
  crop_size: [112, 160]
  # model class name -> application label (uniform | non_uniform | uncertain)
  class_map:
    uniform: uniform
    non_uniform: non_uniform
    uncertain: uncertain
    # striped-clothing candidates (training/striped_train.py: "a person wearing ANY black-and-white stripes").
    # If such a model is activated, the reports' "uniform" means "black-and-white striped clothing".
    striped: uniform
    non_striped: non_uniform

person_detector:
  path: models/person/yolo11n.pt   # official COCO model; downloaded here on first run if missing

inference:
  device: auto                     # auto | cpu | cuda
  person_confidence: 0.40          # minimum person-detection confidence
  inference_size: 640              # person-detector input size
  uniform_confidence: 0.70         # P(uniform) needed for COMPLIANT; below -> UNCERTAIN
  non_uniform_confidence: 0.60     # P(non_uniform) needed for NON-COMPLIANT; below -> UNCERTAIN
  min_person_height_px: 50         # smaller people are UNCERTAIN (too far to judge)
  # Person boxes squatter than this (height / width) are UNCERTAIN ("seated / leaning / cut off"): the
  # fixed torso band (12-55 % of the box height) then falls on the head instead of the shirt, and the
  # classifier answered confidently on hair (2026-10-29 audit). Stopgap until the shirt is located from
  # body keypoints. Cost: seated staff go to REVIEW instead of UNIFORM. 0 = off (previous behaviour).
  min_box_aspect: 1.5
  # Overall store status from the per-person results:
  #   any_uniform : COMPLIANT when at least one person inside the store area is in uniform
  #                 (staff-presence rule — customers in the area do not make it fail)
  #   all_uniform : NON-COMPLIANT when any judged person is not in uniform
  overall_rule: any_uniform
  # When the trained model file is missing:
  #   baseline : stripe-pattern heuristic, clearly labelled "indicative only"
  #   disabled : nobody is judged, every person is UNCERTAIN — PLEASE VERIFY
  untrained_model_mode: baseline

# Scheduled capture (Phase 2 - local sources only until CCTV access is authorised).
# These are the DEFAULTS of the Settings page (Settings -> Advanced).
capture:
  enabled: true                    # master switch; each camera must also be enabled
  store_id: STORE-001              # default store/card id for new cameras
  interval_minutes: 15             # slots aligned to active_start: 09:00, 09:15, 09:30 ...
  active_start: "09:00"            # local time of this PC (inclusive)
  active_end: "21:00"              # local time (exclusive): the last capture is 20:45
  video_step_seconds: 60           # local video sources: footage advanced per capture

# Frame extraction from uploaded videos (Frame Extraction page).
# These are the DEFAULTS of the Settings page (Settings -> Advanced).
extraction:
  default_strategy: random_segments  # random_segments = N screenshots, one random frame from each equal part of the video
                                   # | interval (fixed interval) | random (N random frames from the whole video)
  default_sample_count: 4          # screenshots per video for the random strategies (the initial frame is extra and off by default)
  default_interval_seconds: 30     # prototype testing; 900 (15 min) matches scheduled monitoring
  image_format: png                # png = lossless (pixels exactly as decoded) | jpg = smaller files (quality 95)
  max_frames: 5000                 # refuse a job that would extract more frames than this
